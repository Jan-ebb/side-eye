name: Release

# Push a tag such as v0.16.0 that matches the VERSION file. The workflow builds a universal app with
# llama.cpp's server inside and publishes it as a GitHub release, which is where install.sh finds it.
#
# Both workflows use GitHub's Intel macOS machines: the Apple silicon ones were too scarce to be
# assigned within the queue limit. The release script builds for both architectures either way.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Check the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Logic checks
        run: swift build && .build/debug/SideEye --self-test
      - name: Make sure cmake is installed
        # The release script builds llama.cpp's server, which needs it.
        run: command -v cmake || brew install cmake
      - name: Build the download
        run: ./Scripts/release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/SideEye-*.zip dist/SideEye-*.zip.sha256 \
            --title "Side Eye ${GITHUB_REF_NAME#v}" --generate-notes
